name: Solver regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run solver regression tests
        run: python -m unittest discover -s tests -v
      - name: Check WebWorker JavaScript syntax
        run: node --check solver_worker.js
