<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBSW — 3D Topology Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #111; color: #fff; }
        #sidebar { width: 320px; background: #1a1a1a; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; }
        h1 { font-size: 16px; letter-spacing: 1px; color: #fff; text-transform: uppercase; margin-bottom: 2px; }
        .subtitle { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; text-transform: uppercase; color: #aaa; font-weight: 600; }
        input, select { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; font-size: 13px; border-radius: 4px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { background: #fff; color: #000; border: none; padding: 12px; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        button:hover { background: #ccc; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { font-size: 12px; padding: 10px; border-radius: 4px; background: #222; border: 1px solid #333; color: #aaa; }
        #viewport { flex-grow: 1; position: relative; width: 100%; height: 100%; }
    </style>
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>DBSW</h1>
            <div class="subtitle">3D WASM TOPOLOGY ENGINE</div>
        </div>

        <div class="form-group">
            <label>Material Specification</label>
            <select id="mat_key">
                <option value="EC3_STEEL">Structural Steel — EC3</option>
                <option value="EC2_CONCRETE">Concrete C30/37 — EC2</option>
                <option value="EC5_TIMBER">Glulam GL28h — EC5</option>
            </select>
        </div>

        <div class="form-group">
            <label>Domain Dimensions (Lx, Ly, Lz mm)</label>
            <div class="grid-3">
                <input type="number" id="lx" value="6000">
                <input type="number" id="ly" value="300">
                <input type="number" id="lz" value="600">
            </div>
        </div>

        <div class="form-group">
            <label>FE Mesh Divisions (nx, ny, nz)</label>
            <div class="grid-3">
                <input type="number" id="nelx" value="36">
                <input type="number" id="nely" value="9">
                <input type="number" id="nelz" value="12">
            </div>
        </div>

        <div class="form-group">
            <label>Volume Fraction & Max Iterations</label>
            <div class="grid-2">
                <input type="number" id="volfrac" value="0.20" step="0.05">
                <input type="number" id="max_iter" value="20">
            </div>
        </div>

        <button id="btn-run" disabled>Initialising Wasm...</button>
        <div id="status">Booting Pyodide WebAssembly runtime...</div>
    </div>

    <div id="viewport"></div>

    <script>
        // --- 1. Three.js Scene Setup ---
        const container = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights & Grid
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        let currentMesh = null;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 2. WebWorker Communication ---
        const worker = new Worker('solver_worker.js');
        const btnRun = document.getElementById('btn-run');
        const statusDiv = document.getElementById('status');

        worker.postMessage({ type: 'INIT' });

        worker.onmessage = function (e) {
            const msg = e.data;
            if (msg.type === 'READY') {
                btnRun.disabled = false;
                btnRun.innerText = 'EXECUTE OPTIMISATION';
                statusDiv.innerText = 'Pyodide Wasm Engine Ready.';
                statusDiv.style.borderColor = '#00ff88';
            } else if (msg.type === 'SUCCESS') {
                btnRun.disabled = false;
                btnRun.innerText = 'EXECUTE OPTIMISATION';
                statusDiv.innerText = `Solve Complete! Compliance: ${msg.data.compliance.toExponential(4)}`;
                renderTopologyMesh(msg.data.verts, msg.data.faces);
            } else if (msg.type === 'ERROR') {
                btnRun.disabled = false;
                btnRun.innerText = 'EXECUTE OPTIMISATION';
                statusDiv.innerText = `Error: ${msg.message}`;
                statusDiv.style.borderColor = '#ff4444';
            }
        };

        btnRun.addEventListener('click', () => {
            btnRun.disabled = true;
            btnRun.innerText = 'SOLVING IN WASM...';
            statusDiv.innerText = 'Assembling global stiffness matrix & solving...';

            const params = {
                nelx: parseInt(document.getElementById('nelx').value),
                nely: parseInt(document.getElementById('nely').value),
                nelz: parseInt(document.getElementById('nelz').value),
                lx: parseFloat(document.getElementById('lx').value) / 1000.0,
                ly: parseFloat(document.getElementById('ly').value) / 1000.0,
                lz: parseFloat(document.getElementById('lz').value) / 1000.0,
                volfrac: parseFloat(document.getElementById('volfrac').value),
                max_iter: parseInt(document.getElementById('max_iter').value),
                mat_key: document.getElementById('mat_key').value
            };

            worker.postMessage({ type: 'RUN', params: params });
        });

        // --- 3. Render Mesh extracted from Marching Cubes ---
        function renderTopologyMesh(verts, faces) {
            if (currentMesh) scene.remove(currentMesh);

            const geometry = new THREE.BufferGeometry();
            const positions = [];

            for (const f of faces) {
                for (const idx of f) {
                    positions.push(verts[idx][0], verts[idx][2], verts[idx][1]); // Swap Y/Z for Three.js orientation
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.computeVertexNormals();
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: 0x00a8ff,
                roughness: 0.3,
                metalness: 0.2,
                side: THREE.DoubleSide
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }
    </script>
</body>
</html>
